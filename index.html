<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Excaliflow — Hand-Drawn Diagramming &amp; Live Causal Flow</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Architects+Daughter&family=Caveat:wght@500;700&family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Dual-Layer Retina Canvas Pipeline -->
  <div id="canvasStage">
    <canvas id="staticCanvas"></canvas>
    <canvas id="interactiveCanvas"></canvas>
  </div>

  <!-- Top Bar: Left Brand/Templates | Center Excaliflow Tool Island | Right Flow/Theme/Export -->
  <header id="topHeaderBar">
    <!-- Left Island: Brand + Active Canvas Switcher + Templates -->
    <div class="header-group glass-panel">
      <button id="sidebarToggleBtn" class="ui-btn" title="Toggle Properties Panel (⌘\)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand-badge">
        <span class="brand-icon">E</span>
        <span>Excaliflow</span>
      </div>
      <div class="v-divider"></div>
      <div class="dropdown-wrap">
        <button id="canvasSwitcherBtn" class="ui-btn" title="Switch or Manage Canvases">
          <span id="activeCanvasLabel">AI Agent Swarm</span>
          <span id="activeCanvasCount" class="switcher-count-badge">1/1</span>
          <span style="font-size:9px;opacity:0.65">▾</span>
        </button>
        <div id="canvasesDropdown" class="dropdown-menu align-left glass-panel" style="min-width:240px"></div>
      </div>
      <button id="addCanvasTabBtn" class="ui-btn tab-action-btn" title="New Blank Canvas Tab (⌥T)">+ New</button>
      <button id="forkCanvasTabBtn" class="ui-btn tab-action-btn" title="Duplicate Active Canvas Tab">⧉</button>
      <div class="v-divider"></div>
      <div class="dropdown-wrap">
        <button id="templatesMenuBtn" class="ui-btn" title="Starter Architecture Templates">
          <span>Templates</span>
          <span style="font-size:9px;opacity:0.65">▾</span>
        </button>
        <div id="templatesDropdown" class="dropdown-menu align-left glass-panel">
          <button class="ui-btn menu-item" data-template="AI Agent Swarm"><span>AI Agent Swarm</span><span style="opacity:0.5">5 nodes</span></button>
          <button class="ui-btn menu-item" data-template="How Browsers Work"><span>How Browsers Work</span><span style="opacity:0.5">5 nodes</span></button>
          <button class="ui-btn menu-item" data-template="RAG Pipeline"><span>RAG Pipeline</span><span style="opacity:0.5">5 nodes</span></button>
          <button class="ui-btn menu-item" data-template="Microservices"><span>Microservices</span><span style="opacity:0.5">6 nodes</span></button>
        </div>
      </div>
    </div>

    <!-- Center Island: Iconic Excaliflow Tool Dock -->
    <nav id="bottomToolDock" class="glass-panel" aria-label="Drawing Tools">
      <button id="toolLockBtn" class="dock-tool-btn" title="Keep selected tool active after drawing (Q)">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span class="dock-key">Q</span>
      </button>
      <div class="v-divider"></div>
      <button class="dock-tool-btn active" data-tool="select" title="Selection — Move, resize, bend arrows (V or 1)">
        <svg viewBox="0 0 24 24"><path d="M4 4l7.07 17 2.51-7.39L21 11.07z"/></svg>
        <span class="dock-key">1</span>
      </button>
      <button class="dock-tool-btn" data-tool="hand" title="Hand — Pan canvas (H or Space)">
        <svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v4"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        <span class="dock-key">H</span>
      </button>
      <button class="dock-tool-btn" data-tool="rectangle" title="Rectangle (R or 2)">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/></svg>
        <span class="dock-key">2</span>
      </button>
      <button class="dock-tool-btn" data-tool="diamond" title="Diamond / Decision (D or 3)">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg>
        <span class="dock-key">3</span>
      </button>
      <button class="dock-tool-btn" data-tool="ellipse" title="Ellipse / Circle (O or 4)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
        <span class="dock-key">4</span>
      </button>
      <button class="dock-tool-btn" data-tool="arrow" title="Causal Flow Arrow (A or 5)">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
        <span class="dock-key">5</span>
      </button>
      <button class="dock-tool-btn" data-tool="freedraw" title="Draw Freehand (P or 7)">
        <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
        <span class="dock-key">7</span>
      </button>
      <button class="dock-tool-btn" data-tool="text" title="Text (T or 8)">
        <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        <span class="dock-key">8</span>
      </button>
      <button class="dock-tool-btn" data-tool="sticky" title="Sticky Note (N or 9)">
        <svg viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><polyline points="14 3 14 9 21 9"/></svg>
        <span class="dock-key">9</span>
      </button>
      <button class="dock-tool-btn" data-tool="laser" title="Laser Pointer (K)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M19.07 4.93l-2.12 2.12M7.05 16.95l-2.12 2.12"/></svg>
        <span class="dock-key">K</span>
      </button>
      <button class="dock-tool-btn" data-tool="eraser" title="Eraser (E or 0)">
        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        <span class="dock-key">0</span>
      </button>
    </nav>

    <!-- Right Island: Live Flow Pill + Canvas Theme + Share/Export -->
    <div class="header-group glass-panel">
      <!-- Shown only when the header has no room for the full tool dock;
           it opens #bottomToolDock as a dropdown palette. -->
      <div class="dropdown-wrap" id="toolsMenuWrap">
        <button id="toolsMenuBtn" class="ui-btn tools-menu-btn" title="Drawing Tools" aria-haspopup="true" aria-expanded="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="7" height="7" rx="1.6"></rect>
            <rect x="13" y="4" width="7" height="7" rx="1.6"></rect>
            <rect x="4" y="13" width="7" height="7" rx="1.6"></rect>
            <rect x="13" y="13" width="7" height="7" rx="1.6"></rect>
          </svg>
          <span>Tools</span>
          <span style="font-size:9px;opacity:0.65">▾</span>
        </button>
      </div>
      <div id="masterFlowPill">
        <span id="flowStatusDot" class="flow-status-dot"></span>
        <button id="masterFlowBtn" class="ui-btn active" title="Toggle Live 60fps Causal Data Flow">Flow: ON</button>
      </div>
      <div class="v-divider"></div>
      <button id="bgWhiteBtn" class="ui-btn active" title="Pure White Canvas (#ffffff)">☀</button>
      <button id="bgBlackBtn" class="ui-btn" title="Pitch-Black Neon Canvas (#000000)">☾</button>
      <div class="v-divider"></div>
      <button id="btnSavePng" class="ui-btn primary" title="Export Cropped 2x Retina PNG">Export PNG</button>
      <div class="dropdown-wrap">
        <button id="exportMenuBtn" class="ui-btn" title="More Export &amp; Scene Actions">⋯</button>
        <div id="exportDropdown" class="dropdown-menu glass-panel">
          <button id="btnCopyPng" class="ui-btn menu-item"><span>Copy 2x PNG</span><span>⌘⇧C</span></button>
          <button id="btnRecordVideo" class="ui-btn menu-item"><span>Record 60fps Video</span><span>.webm</span></button>
          <div class="menu-sep"></div>
          <button id="btnSaveJson" class="ui-btn menu-item"><span>Save Scene</span><span>JSON</span></button>
          <button id="btnLoadJson" class="ui-btn menu-item"><span>Load Scene</span><span>Open</span></button>
          <input type="file" id="jsonFileInput" accept=".json,.excaliflow,.excalidraw" style="display:none" />
          <div class="menu-sep"></div>
          <button id="btnClearScene" class="ui-btn menu-item danger"><span>Clear Canvas</span><span>⌫</span></button>
        </div>
      </div>
      <div class="v-divider"></div>
      <div class="dropdown-wrap" id="userMenuWrap">
        <button id="userAuthBtn" class="ui-btn user-btn" title="Sign In or Manage Account">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span id="userAuthLabel">Sign In</span>
          <span style="font-size:9px;opacity:0.65;margin-left:2px">▾</span>
        </button>
        <div id="userDropdown" class="dropdown-menu glass-panel" style="min-width: 200px; right: 0; left: auto;">
          <div class="dropdown-header-info" id="userDropdownHeader">
            <strong id="dropdownUserName">Guest User</strong>
            <small id="dropdownUserEmail">Local mode</small>
          </div>
          <div class="menu-sep"></div>
          <button id="btnMyWorkspaces" class="ui-btn menu-item"><span>📁 My Diagrams</span><span>Projects</span></button>
          <button id="btnNewProject" class="ui-btn menu-item"><span>+ New Diagram</span><span>New</span></button>
          <div class="menu-sep"></div>
          <button id="btnSignOut" class="ui-btn menu-item danger"><span>Sign Out</span><span>⎋</span></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Left Properties Inspector (#leftSidebar) -->
  <aside id="leftSidebar" class="glass-panel">
    <!-- Stroke Color Swatches -->
    <div class="sidebar-section">
      <div class="section-title"><span>Stroke</span></div>
      <div class="swatch-row" id="sidebarSwatches">
        <button class="color-swatch active" data-color="#171717" title="Carbon (#171717)" style="background:#171717"></button>
        <button class="color-swatch" data-color="#0070f3" title="Blue (#0070f3)" style="background:#0070f3"></button>
        <button class="color-swatch" data-color="#7928ca" title="Purple (#7928ca)" style="background:#7928ca"></button>
        <button class="color-swatch" data-color="#10b981" title="Emerald (#10b981)" style="background:#10b981"></button>
        <button class="color-swatch" data-color="#f59e0b" title="Amber (#f59e0b)" style="background:#f59e0b"></button>
        <button class="color-swatch" data-color="#ef4444" title="Rose (#ef4444)" style="background:#ef4444"></button>
        <button class="color-swatch" data-color="#06b6d4" title="Cyan (#06b6d4)" style="background:#06b6d4"></button>
      </div>
    </div>

    <!-- Fill Style -->
    <div class="sidebar-section">
      <div class="section-title"><span>Fill</span></div>
      <div class="segmented-row" id="fillStyleRow">
        <button class="seg-btn active" data-fill-style="hachure" title="Hachure Sketch Fill">Sketch</button>
        <button class="seg-btn" data-fill-style="cross-hatch" title="Cross-Hatch Fill">Cross</button>
        <button class="seg-btn" data-fill-style="solid" title="Solid Tint Fill">Solid</button>
        <button class="seg-btn" data-fill-style="none" title="Outline Only">None</button>
      </div>
    </div>

    <!-- Stroke Width & Style -->
    <div class="sidebar-section">
      <div class="section-title"><span>Stroke Width &amp; Style</span></div>
      <div class="segmented-row" id="strokeWidthRow">
        <button class="seg-btn" data-stroke-width="1.5">Thin</button>
        <button class="seg-btn active" data-stroke-width="2.2">Bold</button>
        <button class="seg-btn" data-stroke-width="3.6">Heavy</button>
      </div>
      <div class="segmented-row" id="strokeStyleRow">
        <button class="seg-btn active" data-stroke-style="solid">Solid</button>
        <button class="seg-btn" data-stroke-style="dashed">Dashed</button>
        <button class="seg-btn" data-stroke-style="dotted">Dotted</button>
      </div>
    </div>

    <!-- Sloppiness & Arrow Type -->
    <div class="sidebar-section">
      <div class="section-title"><span>Sloppiness &amp; Arrow</span></div>
      <div class="segmented-row" id="roughnessRow">
        <button class="seg-btn" data-roughness="0">Clean</button>
        <button class="seg-btn active" data-roughness="0.85">Artist</button>
        <button class="seg-btn" data-roughness="1.75">Cartoon</button>
      </div>
      <div class="segmented-row" id="curveTypeRow">
        <button class="seg-btn active" data-curve-type="curved">Curved</button>
        <button class="seg-btn" data-curve-type="elbow">Elbow</button>
        <button class="seg-btn" data-curve-type="straight">Straight</button>
      </div>
    </div>

    <!-- Typography -->
    <div class="sidebar-section">
      <div class="section-title"><span>Typography</span></div>
      <div class="segmented-row" id="fontFamilyRow">
        <button class="seg-btn active" data-font-family="hand" style="font-family:var(--font-hand);font-size:13px">Hand</button>
        <button class="seg-btn" data-font-family="sans">Normal</button>
        <button class="seg-btn" data-font-family="code" style="font-family:var(--font-mono);font-size:10.5px">Code</button>
      </div>
      <div class="segmented-row" id="fontSizeRow">
        <button class="seg-btn" data-font-size="13">S</button>
        <button class="seg-btn active" data-font-size="15">M</button>
        <button class="seg-btn" data-font-size="19">L</button>
        <button class="seg-btn" data-font-size="24">XL</button>
      </div>
    </div>

    <!-- Live Flow Animation -->
    <div class="sidebar-section">
      <div class="section-title"><span>Flow Animation</span></div>
      <div class="grid-2x2" id="flowModeGrid">
        <button class="seg-btn active" data-flow-mode="comets">☄ Comets</button>
        <button class="seg-btn" data-flow-mode="pulses">◎ Pulses</button>
        <button class="seg-btn" data-flow-mode="neon">⚡ Neon</button>
        <button class="seg-btn" data-flow-mode="dashed">⋯ Stream</button>
      </div>
      <div class="segmented-row" id="flowSpeedRow">
        <button class="seg-btn" data-flow-speed="0.6">0.6x</button>
        <button class="seg-btn active" data-flow-speed="1">1x</button>
        <button class="seg-btn" data-flow-speed="1.8">1.8x</button>
      </div>
    </div>

    <!-- Quick Insert / Chain -->
    <div class="sidebar-section">
      <div class="section-title"><span>Quick Chain</span></div>
      <div class="grid-2x2">
        <button class="seg-btn" data-quick-add="rectangle">+ Box</button>
        <button class="seg-btn" data-quick-add="ellipse">+ Circle</button>
        <button class="seg-btn" data-quick-add="diamond">+ Decision</button>
        <button class="seg-btn" data-quick-add="sticky">+ Sticky</button>
      </div>
    </div>
  </aside>

  <!-- Floating Contextual Selection Toolbar (#quickHud) -->
  <div id="quickHud" class="glass-panel">
    <div id="hudColorDots" style="display:inline-flex;align-items:center;gap:4px"></div>
    <div class="v-divider"></div>
    <div id="hudFontGroup" style="display:inline-flex;align-items:center;gap:2px">
      <button class="ui-btn" data-hud-font="hand" title="Hand-drawn font">Hand</button>
      <button class="ui-btn" data-hud-font="sans" title="Normal font">Sans</button>
      <button class="ui-btn" data-hud-font="code" title="Code font">Code</button>
    </div>
    <div class="v-divider"></div>
    <!-- Node-specific morph & flow actions -->
    <div id="hudNodeControls" style="display:inline-flex;align-items:center;gap:2px">
      <button class="ui-btn" data-hud-morph="rectangle" title="Morph to Box">▭</button>
      <button class="ui-btn" data-hud-morph="ellipse" title="Morph to Circle">◯</button>
      <button class="ui-btn" data-hud-morph="diamond" title="Morph to Decision">◇</button>
      <button id="hudPulseBtn" class="ui-btn" title="Send Pulse Burst">⚡ Pulse</button>
      <button id="hudNextBtn" class="ui-btn" title="Chain Next Node (Tab)">+ Next</button>
    </div>
    <!-- Arrow-specific actions -->
    <div id="hudArrowControls" style="display:none;align-items:center;gap:2px">
      <button class="ui-btn" data-hud-curve="curved">Curved</button>
      <button class="ui-btn" data-hud-curve="elbow">Elbow</button>
      <button class="ui-btn" data-hud-curve="straight">Straight</button>
      <button id="hudArrowFlowBtn" class="ui-btn">Flow ON</button>
      <button id="hudFlipArrowBtn" class="ui-btn" title="Reverse Arrow Direction">⇄</button>
    </div>
    <div class="v-divider"></div>
    <button id="hudDuplicateBtn" class="ui-btn" title="Duplicate (⌘D)">⧉</button>
    <button id="hudDeleteBtn" class="ui-btn danger" title="Delete (⌫)">✕</button>
  </div>

  <!-- Bottom-Left Undo/Redo Pill (Excaliflow Standard Placement) -->
  <div id="bottomLeftBar" class="glass-panel">
    <button id="btnUndo" class="ui-btn" title="Undo (⌘Z)">↶</button>
    <button id="btnRedo" class="ui-btn" title="Redo (⇧⌘Z)">↷</button>
  </div>

  <!-- Bottom-Center Multi-Canvas Tab Bar (Figma / Excalidraw Pages Style) -->
  <div id="bottomCanvasDock" class="glass-panel">
    <div id="canvasTabStrip" class="canvas-tab-strip" role="tablist" aria-label="Canvas Tabs"></div>
    <div class="v-divider"></div>
    <button id="bottomAddTabBtn" class="ui-btn tab-action-btn" title="New Blank Canvas Tab (⌥T)">+ Canvas</button>
    <button id="bottomForkTabBtn" class="ui-btn tab-action-btn" title="Duplicate Current Canvas">⧉</button>
  </div>

  <!-- Bottom-Right Zoom Pill -->
  <div id="zoomPill" class="glass-panel">
    <button id="zoomOutBtn" class="ui-btn" title="Zoom Out">−</button>
    <button id="zoomResetBtn" class="ui-btn" title="Reset Zoom to 100%">100%</button>
    <button id="zoomInBtn" class="ui-btn" title="Zoom In">+</button>
    <div class="v-divider"></div>
    <button id="zoomFitBtn" class="ui-btn" title="Fit Diagram to Screen">Fit</button>
  </div>

  <!-- Inline Text Editor -->
  <div id="inlineEditorWrap">
    <textarea id="inlineTextEditor" rows="1" spellcheck="false"></textarea>
  </div>

  <!-- Toast Status Pill -->
  <div id="studioToast" class="glass-panel"></div>

  <!-- Auth Modal Dialog -->
  <div id="authModalBackdrop" class="modal-backdrop" style="display:none">
    <div class="modal-card glass-panel" role="dialog" aria-labelledby="authModalTitle">
      <div class="modal-header">
        <h3 id="authModalTitle">Sign In to Excaliflow</h3>
        <button id="closeAuthModalBtn" class="modal-close-btn" title="Close">✕</button>
      </div>
      <div class="modal-tabs">
        <button id="tabAuthLogin" class="modal-tab-btn active">Sign In</button>
        <button id="tabAuthRegister" class="modal-tab-btn">Create Account</button>
      </div>
      <div id="authAlertBanner" class="auth-alert" style="display:none"></div>
      <form id="authForm" onsubmit="return false;">
        <div class="form-group" id="fullNameGroup" style="display:none">
          <label for="authFullName">Full Name</label>
          <input type="text" id="authFullName" class="form-input" placeholder="e.g. John Doe" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="authUsername" id="authUsernameLabel">Username or Email</label>
          <input type="text" id="authUsername" class="form-input" placeholder="Enter username or email" autocomplete="username" required />
        </div>
        <div class="form-group" id="emailGroup" style="display:none">
          <label for="authEmail">Email Address</label>
          <input type="email" id="authEmail" class="form-input" placeholder="name@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" class="form-input" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" id="authSubmitBtn" class="ui-btn primary modal-submit-btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Workspaces / Diagram Projects Modal -->
  <div id="workspacesModalBackdrop" class="modal-backdrop" style="display:none">
    <div class="modal-card glass-panel wide" role="dialog" aria-labelledby="workspacesModalTitle">
      <div class="modal-header">
        <h3 id="workspacesModalTitle">My Diagrams</h3>
        <button id="closeWorkspacesModalBtn" class="modal-close-btn" title="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="workspace-action-bar">
          <input type="text" id="newWorkspaceNameInput" class="form-input" placeholder="New diagram project name..." />
          <button id="btnCreateWorkspaceConfirm" class="ui-btn primary">+ Create Project</button>
        </div>
        <div id="workspacesListContainer" class="workspaces-grid">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <!-- Destructive Action Confirmation Modal -->
  <div id="confirmModalBackdrop" class="modal-backdrop" style="display:none">
